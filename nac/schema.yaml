---
iosxe: include('iosxe', required=False)
defaults: any(required=False)
---
iosxe:
  global: include('global', required=False)
  devices: list(include('devices'), required=False, primary_key='name')
  device_groups: list(include('device_groups'), required=False, primary_key='name')
  interface_groups: list(include('interface_groups'), required=False, primary_key='name')
  templates: list(include('iosxe_templates'), required=False, primary_key='name')

global:
  version: str(required=False)
  variables: map(key=str(), required=False)
  configuration: include('device_configuration', required=False)
  templates: list(str(), required=False)

devices:
  name: str()
  url: str(required=False)
  host: str(required=False)
  managed: bool(required=False)
  protocol: enum('restconf', 'netconf', required=False)
  version: str(required=False)
  device_groups: list(str(), required=False)
  variables: map(key=str(), required=False)
  configuration: include('device_configuration', required=False)
  templates: list(str(), required=False)
  cli_templates: list(include('cli_templates'), required=False, primary_key='name')
  interface_group_policy: any(enum('merge', 'replace'), regex("^.*[\$\%]\{.*$"), required=False)

cli_templates:
  name: str()
  stage: enum('pre', 'post', required=False)
  order: int(min=0, max=9, required=False)
  content: str()

device_configuration:
  aaa: include('aaa', required=False)
  access_lists: include('access_lists', required=False)
  arp: include('arp', required=False)
  banner: include('banner', required=False)
  bfd: include('bfd', required=False)
  cdp: include('cdp', required=False)
  clock: include('clock', required=False)
  community_lists: include('community_lists', required=False)
  crypto: include('crypto', required=False)
  cts: include('cts', required=False)
  device_sensor: include('device_sensor', required=False)
  device_tracking: include('device_tracking', required=False)
  dhcp: include('dhcp', required=False)
  dhcp_pools: list(include('dhcp_pools'), required=False, primary_key='name')
  policy: include('policy', required=False)
  dot1x: include('dot1x', required=False)
  eem: include('eem', required=False)
  errdisable: include('errdisable', required=False)
  evpn: include('evpn', required=False)
  flow: include('flow', required=False)
  interfaces: include('interfaces', required=False)
  bridge_domains: list(include('bridge_domains'), required=False, primary_key='id')
  key_chains: list(include('key_chains'), required=False, primary_key='name')
  l2_vfi: include('l2_vfi', required=False)
  large_community_lists: include('large_community_lists', required=False)
  license: include('license', required=False)
  line: include('line', required=False)
  evpn_profile: include('evpn_profile', required=False)
  lldp: include('lldp', required=False)
  logging: include('logging', required=False)
  mdt_subscriptions: list(include('mdt_subscriptions'), required=False)
  monitor_sessions: list(include('monitor_sessions'), required=False, primary_key='session_id')
  msdp: include('msdp', required=False)
  mpls: include('mpls', required=False)
  multicast: include('multicast', required=False)
  nat: include('nat', required=False)
  ntp: include('ntp', required=False)
  object_groups_fqdn: list(include('object_groups_fqdn'), required=False, primary_key='name')
  object_groups_network: list(include('object_groups_network'), required=False, primary_key='name')
  object_groups_service: list(include('object_groups_service'), required=False, primary_key='name')
  pim: include('pim', required=False)
  ipv6_dhcp_pools: list(include('ipv6_dhcp_pools'), required=False, primary_key='name')
  ipv6_local_pools: list(include('ipv6_local_pools'), required=False, primary_key='name')
  ipv6_pim: include('ipv6_pim', required=False)
  prefix_lists: list(include('prefix_lists'), required=False, primary_key='name')
  ipv6_prefix_lists: list(include('ipv6_prefix_lists'), required=False, primary_key='name')
  qos: include('qos', required=False)
  route_maps: list(include('route_maps'), required=False, primary_key='name')
  routing: include('routing', required=False)
  service_templates: list(include('service_templates'), required=False, primary_key='name')
  service: include('service', required=False)
  snmp_server: include('snmp_server', required=False)
  spanning_tree: include('spanning_tree', required=False)
  stackwise_virtual: include('stackwise_virtual', required=False)
  system: include('system', required=False)
  templates: list(include('templates'), required=False, primary_key='name')
  udld: include('udld', required=False)
  vlan: include('vlan', required=False)
  vrfs: list(include('vrfs'), required=False, primary_key='name')
  vtp: include('vtp', required=False)
  wireless: include('wireless', required=False)
  zone_pair_security: list(include('zone_pair_security'), required=False, primary_key='name')
  zone_security: include('zone_security', required=False)

bridge_domains:
  id: any(int(min=1, max=16000), regex("^.*[\$\%]\{.*$"))
  member_vni: any(int(min=4096, max=16777215), regex("^.*[\$\%]\{.*$"), required=False)
  member_interfaces: list(include('bridge_domain_member_interfaces'), required=False, primary_key='name')

bridge_domain_member_interfaces:
  name: any(str(), regex("^.*[\$\%]\{.*$"))
  service_instance: any(int(min=1, max=8000), regex("^.*[\$\%]\{.*$"), required=False)

device_groups:
  name: str()
  version: str(required=False)
  devices: list(str(), required=False)
  variables: map(key=str(), required=False)
  configuration: include('device_configuration', required=False)
  templates: list(str(), required=False)

interface_groups:
  name: str()
  variables: map(key=str(), required=False)
  configuration: include('interface_group_configuration', required=False)

iosxe_templates:
  name: str()
  type: enum('model', 'file', 'cli')
  file: str(required=False)
  stage: enum('pre', 'post', required=False)
  order: int(min=0, max=9, required=False)
  content: str(required=False)
  configuration: include('device_configuration', required=False)

aaa:
  new_model: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  session_id: any(enum('common', 'unique'), regex("^.*[\$\%]\{.*$"), required=False)
  local_authentication_type: any(str(), regex("^.*[\$\%]\{.*$"), required=False)
  local_authorization: any(str(), regex("^.*[\$\%]\{.*$"), required=False)
  local_authentication_max_fail_attempts: any(int(min=1, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  radius_dynamic_author: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  radius_dynamic_author_clients: list(include('aaa_radius_dynamic_author_clients'), required=False, primary_key='ip')
  radius_groups: list(include('aaa_radius_groups'), required=False, primary_key='name')
  tacacs_groups: list(include('aaa_tacacs_groups'), required=False, primary_key='name')
  accounting: include('aaa_accounting', required=False)
  authentication: include('aaa_authentication', required=False)
  authorization: include('aaa_authorization', required=False)
  radius: include('aaa_radius', required=False)
  tacacs: include('aaa_tacacs', required=False)
  usernames: list(include('aaa_usernames'), required=False, primary_key='name')

aaa_radius_dynamic_author_clients:
  ip: any(ip(), regex("^.*[\$\%]\{.*$"))
  key_type: any(enum('0', '6', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  key: str(required=False)

aaa_radius_groups:
  name: str()
  deadtime: any(int(min=0, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  server_names: any(list(str()), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_type: any(enum('Loopback', 'Vlan', 'GigabitEthernet', 'TwoGigabitEthernet', 'FiveGigabitEthernet', 'TenGigabitEthernet', 'TwentyFiveGigabitEthernet', 'FortyGigabitEthernet', 'FiftyGigabitEthernet', 'HundredGigabitEthernet'), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_id: any(str(), int(min=0), required=False)

aaa_tacacs_groups:
  name: str()
  vrf: any(str(), regex("^.*[\$\%]\{.*$"), required=False)
  server_names: any(list(str()), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_type: any(enum('Loopback', 'Vlan', 'GigabitEthernet', 'TwoGigabitEthernet', 'FiveGigabitEthernet', 'TenGigabitEthernet', 'TwentyFiveGigabitEthernet', 'FortyGigabitEthernet', 'FiftyGigabitEthernet', 'HundredGigabitEthernet'), regex("^.*[\$\%]\{.*$"), required=False)
  source_interface_id: any(str(), int(min=0), required=False)

aaa_accounting:
  update_newinfo_periodic: any(int(), regex("^.*[\$\%]\{.*$"), required=False)
  system_guarantee_first: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  identities: list(include('aaa_accounting_identities'), required=False, primary_key='name')
  identity_default_start_stop_groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)
  commands: list(include('aaa_accounting_commands'), required=False, primary_key='level,list_name')
  connections: list(include('aaa_accounting_connections'), required=False, primary_key='name')
  execs: list(include('aaa_accounting_execs'), required=False, primary_key='name')
  networks: list(include('aaa_accounting_networks'), required=False, primary_key='name')
  dot1x: list(include('aaa_accounting_dot1x'), required=False, primary_key='name')
  dot1x_defaults: list(any(str()), max=4, required=False)
  dot1x_default_start_stop_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  dot1x_default_start_stop_group_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  dot1x_default_start_stop_group_logger: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

aaa_accounting_identities:
  name: str()
  start_stop_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_group_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_group_logger: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)
  identity_default_start_stop_groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)

aaa_accounting_commands:
  level: any(int(min=0, max=15), regex("^.*[\$\%]\{.*$"))
  list_name: str()
  action_type: any(enum('start-stop', 'stop-only'), regex("^.*[\$\%]\{.*$"), required=False)
  group_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  group_logger: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)

aaa_accounting_connections:
  name: str()
  none: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_group_logger: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)
  stop_only_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  stop_only_group_logger: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  stop_only_groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)

aaa_accounting_execs:
  name: str()
  none: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_group_logger: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)
  stop_only_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  stop_only_group_logger: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  stop_only_groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)

aaa_accounting_networks:
  name: str()
  start_stop_groups: any(list(str(), max=2), regex("^.*[\$\%]\{.*$"), required=False)

aaa_accounting_dot1x:
  name: str()
  start_stop_groups: any(list(str(), max=4), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_group_broadcast: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  start_stop_group_logger: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

aaa_authentication:
  logins: list(include('aaa_authentication_logins'), required=False, primary_key='name')
  dot1xs: list(include('aaa_authentication_dot1xs'), required=False, primary_key='name')
  dot1x_defaults: list(any(str(), enum('local')), max=4, required=False)
  enable_defaults_legacy: any(str(), enum('enable', 'line', 'none'), regex("^.*[\$\%]\{.*$"), required=False)
  enable_defaults: list(include('aaa_authentication_enable_defaults'), max=4, required=False)

aaa_authentication_logins:
  name: str()
  methods: list(any(str(), enum('none', 'line', 'enable', 'local')), max=4, required=False)

aaa_authentication_dot1xs:
  name: str()
  methods: list(any(str(), enum('local', 'cache', 'radius')), max=4, required=False)

aaa_authentication_enable_defaults:
  method: any(str(), enum('enable', 'line', 'none'), regex("^.*[\$\%]\{.*$"), required=False)
  cache: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

aaa_authorization:
  commands: list(include('aaa_authorization_commands'), required=False, primary_key='level,list_name')
  config_commands: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  config_lists: list(include('aaa_authorization_config_lists'), required=False, primary_key='name')
  console: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  execs: list(include('aaa_authorization_execs'), required=False, primary_key='name')
  networks: list(include('aaa_authorization_networks'), required=False, primary_key='name')

aaa_authorization_commands:
  level: any(int(min=0, max=15), regex("^.*[\$\%]\{.*$"))
  list_name: str()
  methods: list(any(str(), enum('local', 'radius', 'tacacs', 'if_authenticated', 'none')), max=4, required=False)

aaa_authorization_config_lists:
  name: str()
  groups: list(include('aaa_authorization_config_lists_groups'), max=1, required=False)

aaa_authorization_config_lists_groups:
  cache: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  method: any(str(), enum('radius', 'tacacs'), regex("^.*[\$\%]\{.*$"), required=False)

aaa_authorization_execs:
  name: str()
  methods: list(any(str(), enum('local', 'radius', 'tacacs', 'if_authenticated', 'none')), max=4, required=False)

aaa_authorization_networks:
  name: str()
  methods: list(any(str(), enum('local')), max=4, required=False)

aaa_radius:
  attributes: list(include('aaa_radius_attributes'), required=False, primary_key='number')
  dead_criteria_time: any(int(min=1, max=120), regex("^.*[\$\%]\{.*$"), required=False)
  dead_criteria_tries: any(int(min=1, max=100), regex("^.*[\$\%]\{.*$"), required=False)
  deadtime: any(int(min=1, max=1440), regex("^.*[\$\%]\{.*$"), required=False)
  servers: list(include('aaa_radius_servers'), required=False, primary_key='name')

aaa_radius_attributes:
  number: any(int(), regex("^.*[\$\%]\{.*$"))
  attribute_31_parameters: list(include('aaa_radius_attributes_attribute_31_parameters'), required=False)
  send_attributes: list(str(), regex("^.*[\$\%]\{.*$"), required=False)

aaa_radius_attributes_attribute_31_parameters:
  calling_station_id: any(enum('mac', 'send'), regex("^.*[\$\%]\{.*$"), required=False)
  id_mac_format: any(enum('ietf'), regex("^.*[\$\%]\{.*$"), required=False)
  id_mac_lu_case: any(enum('lower-case', 'upper-case'), regex("^.*[\$\%]\{.*$"), required=False)
  id_send_nas_port_detail: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  id_send_mac_only: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

aaa_radius_servers:
  name: str()
  ip: any(ip(), regex("^.*[\$\%]\{.*$"))
  authentication_port: any(int(min=0, max=65534), regex("^.*[\$\%]\{.*$"), required=False)
  accounting_port: any(int(min=0, max=65534), regex("^.*[\$\%]\{.*$"), required=False)
  timeout: any(int(min=1, max=1000), regex("^.*[\$\%]\{.*$"), required=False)
  retransmit: any(int(min=0, max=100), regex("^.*[\$\%]\{.*$"), required=False)
  key: str(required=False)
  encryption: any(enum(0, 6, 7), required=False)
  automate_tester_username: str(required=False)
  automate_tester_ignore_acct_port: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  automate_tester_probe_on_config: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  automate_tester_ignore_auth_port: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  automate_tester_idle_time: any(int(min=1, max=35791), regex("^.*[\$\%]\{.*$"), required=False)
  pac_key: str(required=False)
  pac_key_encryption: any(enum(0, 6, 7),  required=False)

aaa_tacacs:
  timeout: any(int(min=1, max=1000), regex("^.*[\$\%]\{.*$"), required=False)
  directed_request: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  directed_request_restricted: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  directed_request_no_truncate: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  key: str(required=False)
  encryption: any(enum(0, 6, 7), required=False)
  attribute_allow_unknown: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  servers: list(include('aaa_tacacs_servers'), required=False, primary_key='name')

aaa_tacacs_servers:
  name: str()
  ip: any(ip(), regex("^.*[\$\%]\{.*$"))
  timeout: any(int(min=1, max=1000), regex("^.*[\$\%]\{.*$"), required=False)
  port: any(int(min=1, max=65535), regex("^.*[\$\%]\{.*$"), required=False)
  key: str(required=False)
  encryption: any(enum(0, 6, 7), required=False)

aaa_usernames:
  name: str()
  privilege: any(int(min=0, max=15), regex("^.*[\$\%]\{.*$"), required=False)
  description: str(required=False)
  password_encryption: any(enum('0', '6', '7'), regex("^.*[\$\%]\{.*$"), required=False)
  password: str(required=False)
  secret_encryption: any(enum('0', '5', '8', '9'), regex("^.*[\$\%]\{.*$"), required=False)
  secret: str(required=False)

access_lists:
  standard: list(include('access_lists_standard'), required=False, primary_key='name')
  extended: list(include('access_lists_extended'), required=False, primary_key='name')
  role_based: list(include('access_lists_role_based'), required=False, primary_key='name')
  as_path: list(include('as_path_access_list'), required=False, primary_key='number')

access_lists_standard:
  name: str()
  entries: list(include('access_lists_standard_entries'), required=False, primary_key='sequence')

access_lists_standard_entries:
  sequence: any(int(), regex("^.*[\$\%]\{.*$"),)
  remark: str(required=False)
  action: any(enum('deny', 'permit'), regex("^.*[\$\%]\{.*$"), required=False)
  prefix: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  prefix_mask: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  any: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  host: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  log: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

access_lists_extended:
  name: str()
  entries: list(include('access_lists_extended_entries'), required=False, primary_key='sequence')

access_lists_extended_entries:
  sequence: any(int(), regex("^.*[\$\%]\{.*$"))
  remark: str(required=False)
  action: any(enum('deny', 'permit'), regex("^.*[\$\%]\{.*$"), required=False)
  protocol: any(enum('ahp', 'eigrp', 'esp', 'gre', 'icmp', 'igmp', 'ip', 'ipinip', 'nos', 'object-group', 'ospf', 'pcp', 'pim', 'tcp', 'udp'), int(min=0, max=255), regex("^.*[\$\%]\{.*$"), required=False)
  service_object_group: str(required=False)
  source: include('access_lists_extended_entries_source', required=False)
  destination: include('access_lists_extended_entries_destination', required=False)
  tcp_flags: any(list(enum('ack', 'fin', 'psh', 'rst', 'syn', 'urg'), regex("^.*[\$\%]\{.*$")), required=False)
  established: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  fragments: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  dscp: any(enum('af11', 'af12', 'af13', 'af21', 'af22', 'af23', 'af31', 'af32', 'af33', 'af41', 'af42', 'af43', 'cs1', 'cs2', 'cs3', 'cs4', 'cs5', 'cs6', 'cs7', 'default', 'dscp', 'ef', 'precedence'), int(min=0, max=63), regex("^.*[\$\%]\{.*$"), required=False)
  precedence: any(enum('critical', 'flash', 'flash-override', 'immediate', 'internet', 'network', 'priority', 'routine'), int(min=0, max=7), regex("^.*[\$\%]\{.*$"), required=False)
  tos: any(enum('max-reliability', 'max-throughput', 'min-delay', 'min-monetary-cost', 'normal'), int(min=0, max=15), regex("^.*[\$\%]\{.*$"), required=False)
  icmp_message_type: any(str(), int(min=0, max=255), regex("^.*[\$\%]\{.*$"), required=False)
  icmp_message_code: any(int(min=0, max=255), regex("^.*[\$\%]\{.*$"), required=False)
  log: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  log_input: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)

access_lists_extended_entries_source:
  prefix: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  prefix_mask: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  any: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  host: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  object_group: str(required=False)
  fqdn_group: str(required=False)
  port_type: any(enum('equal', 'greater_than', 'lesser_than', 'range'), regex("^.*[\$\%]\{.*$"), required=False)
  port: any(int(), regex("^.*[\$\%]\{.*$"), str(), required=False)
  additional_equal_ports: any(list(int(), max=9), regex("^.*[\$\%]\{.*$"), required=False)
  port_range_from: any(int(), regex("^.*[\$\%]\{.*$"), required=False)
  port_range_to: any(int(), regex("^.*[\$\%]\{.*$"), required=False)

access_lists_extended_entries_destination:
  prefix: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  prefix_mask: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  any: any(bool(), regex("^.*[\$\%]\{.*$"), required=False)
  host: any(ip(), regex("^.*[\$\%]\{.*$"), required=False)
  object_group: str(required=False)
  fqdn_group: str(required=False)
